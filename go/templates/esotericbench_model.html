<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Model · EsotericBench</title>
        <link rel="stylesheet" href="/static/css/bloonsbench.css?v=20260905-2" />
    </head>
    <body>
        <header>
            <nav aria-label="Primary">
                <a href="/esotericbench/">EsotericBench</a>
                <a href="/esotericbench/about">About</a>
                <a href="https://github.com/cnqso/esotericbench">GitHub</a>
            </nav>
        </header>

        <main>
            <h1 id="model-name">Loading…</h1>
            <p class="model-summary" id="model-summary"></p>
            <p class="table-note">Question text withheld · points / maximum · record is the highest five-run average</p>

            <div class="table-wrap">
                <table class="question-table">
                    <thead>
                        <tr>
                            <th scope="col">Question</th>
                            <th scope="col">Average</th>
                            <th scope="col">Model best</th>
                            <th scope="col">Model worst</th>
                            <th scope="col">Record</th>
                        </tr>
                    </thead>
                    <tbody id="question-body">
                        <tr><td colspan="5">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

        <script>
            const REPOSITORY = "cnqso/esotericbench";
            const BRANCH = "main";
            const TREE_API = `https://api.github.com/repos/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;
            const RAW_ROOT = `https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/`;
            function modelSlug(model) {
                return model
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-|-$/g, "");
            }

            function summarizeModel(model) {
                const questions = (model.sections || []).flatMap((section) =>
                    (section.questions || []).map((question) => [
                        question.question_id,
                        question.average_score,
                        question.best_score,
                        question.worst_score,
                        question.maximum_score,
                        question.run_scores,
                    ]),
                );
                return {
                    ...model,
                    questions,
                };
            }

            async function loadResults() {
                const treeResponse = await fetch(TREE_API, {
                    headers: { Accept: "application/vnd.github+json" },
                });
                if (!treeResponse.ok) throw new Error(`GitHub returned ${treeResponse.status}`);

                const tree = await treeResponse.json();
                const scorecardPaths = tree.tree
                    .filter(
                        (entry) =>
                            entry.type === "blob" &&
                            entry.path.startsWith("results/") &&
                            /\.json$/.test(entry.path),
                    )
                    .map((entry) => entry.path);
                if (!scorecardPaths.length) throw new Error("No public scorecards found");

                const scorecards = await Promise.all(
                    scorecardPaths.map(async (path) => {
                        const response = await fetch(`${RAW_ROOT}${path}`);
                        if (!response.ok) throw new Error(`Could not load ${path}`);
                        return response.json();
                    }),
                );

                const results = scorecards.flatMap((scorecard) =>
                    String(scorecard.schema_version || "").startsWith("esotericbench-public-scorecard-")
                        ? (scorecard.models || []).map((model) =>
                              summarizeModel({ ...model, generated_at: scorecard.generated_at }),
                          )
                        : [],
                );
                if (!results.length) throw new Error("No valid public scorecards found");

                const latestByModel = new Map();
                for (const result of results) {
                    const previous = latestByModel.get(result.model);
                    if (!previous || String(result.generated_at || "") > String(previous.generated_at || "")) {
                        latestByModel.set(result.model, result);
                    }
                }
                return Array.from(latestByModel.values());
            }

            function questionRecords(results) {
                const records = new Map();
                for (const result of results) {
                    if (result.completed_repetitions !== 5 || result.expected_repetitions !== 5) continue;
                    for (const [question, , , , , runScores] of result.questions) {
                        if (
                            !Array.isArray(runScores) ||
                            runScores.length !== 5 ||
                            !runScores.every(Number.isFinite)
                        ) {
                            continue;
                        }
                        const average = runScores.reduce((sum, score) => sum + score, 0) / 5;
                        if (!Number.isFinite(average)) continue;
                        const holder = {
                            model: result.model,
                            label: result.label || result.model,
                        };
                        const record = records.get(question);
                        if (!record || average > record.score) {
                            records.set(question, { score: average, holders: [holder] });
                        } else if (average === record.score) {
                            record.holders.push(holder);
                        }
                    }
                }
                for (const record of records.values()) {
                    record.holders.sort((a, b) => a.label.localeCompare(b.label));
                }
                return records;
            }

            function installTooltips() {
                const tooltip = document.createElement("div");
                tooltip.className = "simple-tooltip";
                tooltip.setAttribute("role", "tooltip");
                tooltip.hidden = true;
                document.body.appendChild(tooltip);
                let activeTarget = null;

                function show(target) {
                    activeTarget = target;
                    tooltip.textContent = target.dataset.tooltip;
                    tooltip.hidden = false;
                    const targetRect = target.getBoundingClientRect();
                    const tooltipRect = tooltip.getBoundingClientRect();
                    const margin = 8;
                    let left = targetRect.right - tooltipRect.width;
                    left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));
                    let top = targetRect.bottom + margin;
                    if (top + tooltipRect.height > window.innerHeight - margin) {
                        top = targetRect.top - tooltipRect.height - margin;
                    }
                    tooltip.style.left = `${left}px`;
                    tooltip.style.top = `${Math.max(margin, top)}px`;
                }

                function hide() {
                    activeTarget = null;
                    tooltip.hidden = true;
                }

                document.addEventListener("pointerover", (event) => {
                    const target = event.target.closest?.(".tooltip-target");
                    if (target && event.pointerType !== "touch") show(target);
                });
                document.addEventListener("pointerout", (event) => {
                    if (
                        activeTarget &&
                        event.pointerType !== "touch" &&
                        !activeTarget.contains(event.relatedTarget) &&
                        document.activeElement !== activeTarget
                    ) {
                        hide();
                    }
                });
                document.addEventListener("focusin", (event) => {
                    const target = event.target.closest?.(".tooltip-target");
                    if (target) show(target);
                });
                document.addEventListener("focusout", (event) => {
                    if (activeTarget === event.target) hide();
                });
                document.addEventListener("click", (event) => {
                    const target = event.target.closest?.(".tooltip-target");
                    if (target) show(target);
                    else hide();
                });
                document.addEventListener("keydown", (event) => {
                    if (event.key === "Escape") hide();
                });
                window.addEventListener("scroll", hide, true);
                window.addEventListener("resize", hide);
            }

            function renderModel(result, records) {
                const label = result.label || result.model;
                document.title = `${label} · EsotericBench`;
                document.getElementById("model-name").textContent = label;
                document.getElementById("model-summary").textContent =
                    `${result.completed_repetitions} runs · ${result.average_score.toFixed(1)} / ${result.maximum_score.toLocaleString()} average · ${result.best_score} / ${result.maximum_score.toLocaleString()} segment best · ${result.worst_score} / ${result.maximum_score.toLocaleString()} segment worst`;

                const body = document.getElementById("question-body");
                body.replaceChildren();
                let previousSection = null;
                for (const [question, average, best, worst, maximum] of result.questions) {
                    const section = question.charAt(0);
                    const row = document.createElement("tr");
                    if (previousSection !== null && section !== previousSection) {
                        row.classList.add("section-start");
                    }
                    previousSection = section;

                    const questionCell = document.createElement("td");
                    questionCell.textContent = question;
                    const record = records.get(question);
                    const soleRecordHolder =
                        record?.holders.length === 1 && record.holders[0].model === result.model;
                    if (soleRecordHolder) {
                        const star = document.createElement("span");
                        star.className = "record-star tooltip-target";
                        star.textContent = "★";
                        star.dataset.tooltip = "Sole record holder for this question.";
                        star.tabIndex = 0;
                        star.setAttribute("aria-label", "Sole record holder for this question");
                        questionCell.append(" ", star);
                    }
                    row.appendChild(questionCell);

                    const values = [
                        `${Number(average).toFixed(1)} / ${maximum}`,
                        `${best} / ${maximum}`,
                        `${worst} / ${maximum}`,
                    ];
                    values.forEach((value, index) => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        if (index === 0) {
                            const percentage = Math.max(0, Math.min(100, (average / maximum) * 100));
                            cell.classList.add("score-cell");
                            cell.style.setProperty("--score-pct", `${percentage}%`);
                            cell.title = `${percentage.toFixed(1)}% of maximum`;
                        }
                        row.appendChild(cell);
                    });

                    const recordCell = document.createElement("td");
                    recordCell.textContent = record ? `${Number(record.score).toFixed(1)} / ${maximum}` : "—";
                    if (record) {
                        const holderText = `Held by:\n${record.holders.map((holder) => holder.label).join("\n")}`;
                        recordCell.dataset.tooltip = holderText;
                        recordCell.classList.add("tooltip-target");
                        recordCell.tabIndex = 0;
                        recordCell.setAttribute("aria-label", `${recordCell.textContent}. ${holderText}`);
                    }
                    row.appendChild(recordCell);
                    body.appendChild(row);
                }
            }

            window.addEventListener("DOMContentLoaded", () => {
                installTooltips();
                const requestedSlug = location.pathname.split("/").filter(Boolean).at(-1);
                loadResults()
                    .then((results) => {
                        const result = results.find((candidate) => modelSlug(candidate.model) === requestedSlug);
                        if (!result) throw new Error("Model not found");
                        renderModel(result, questionRecords(results));
                    })
                    .catch((error) => {
                        const missing = error.message === "Model not found";
                        document.getElementById("model-name").textContent = missing
                            ? "Model not found"
                            : "Results unavailable";
                        document.getElementById("model-summary").textContent = "";
                        document.getElementById("question-body").innerHTML =
                            `<tr><td colspan="5">${missing ? "No scorecard found." : "Could not load results from GitHub."}</td></tr>`;
                    });
            });
        </script>
    </body>
</html>
